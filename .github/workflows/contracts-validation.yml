name: Validate AI Toolkit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-contracts:
    name: Validate AI Toolkit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run AI toolkit validator
        shell: pwsh
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            ./tools/Validate-ChangedToolkits.ps1 -ChangedScope Branch -SkipInteractiveRegressionHarness
            exit $LASTEXITCODE
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $before = $env:GITHUB_EVENT_BEFORE
            if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
              $before = "$env:GITHUB_SHA^"
            }

            $changedPaths = @(git diff --name-only "$before..$env:GITHUB_SHA")
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            ./tools/Validate-ChangedToolkits.ps1 -ChangedPaths $changedPaths -SkipInteractiveRegressionHarness
            exit $LASTEXITCODE
          }

          $validationFailed = $false

          & pwsh -NoProfile -File ./tools/Validate-InteractiveToolkit.ps1 -SkipRegressionHarness
          if ($LASTEXITCODE -ne 0) {
            $validationFailed = $true
          }

          & pwsh -NoProfile -File ./hosted_copilot/tools/Test-Toolkit.ps1
          if ($LASTEXITCODE -ne 0) {
            $validationFailed = $true
          }

          & pwsh -NoProfile -File ./tools/Test-ChangedToolkitRouting.ps1
          if ($LASTEXITCODE -ne 0) {
            $validationFailed = $true
          }

          if ($validationFailed) {
            exit 1
          }
