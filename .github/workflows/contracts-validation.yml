name: Validate AI Toolkit

on:
  push:
    branches: [ main ]
    paths:
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/pull_request_template.md'
      - '.github/skills/**'
      - 'CONTRIBUTING.md'
      - 'docs/AI_TOOLKIT_ALIGNMENT_CHECKLIST.md'
      - 'docs/HOSTED_COPILOT_CODE_REVIEW_ARCHITECTURE.md'
      - 'hosted_copilot/**'
      - 'tools/Test-ChangedToolkitRouting.ps1'
      - 'tools/Validate-ChangedToolkits.ps1'
      - 'tools/Validate-InteractiveToolkit.ps1'
      - 'tools/config/upstream-contributor.json'
      - 'tools/check-upstream-contributor-drift.ps1'
      - 'tools/toolkit-ownership.json'
      - 'tools/validate-ai-toolkit.ps1'
      - 'tools/validate-runtime-line-endings.ps1'
      - 'tools/validate-copied-markdown-links.ps1'
      - 'tools/validate-contracts.ps1'
      - '.gitattributes'
      - '.github/workflows/contracts-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/pull_request_template.md'
      - '.github/skills/**'
      - 'CONTRIBUTING.md'
      - 'docs/AI_TOOLKIT_ALIGNMENT_CHECKLIST.md'
      - 'docs/HOSTED_COPILOT_CODE_REVIEW_ARCHITECTURE.md'
      - 'hosted_copilot/**'
      - 'tools/Test-ChangedToolkitRouting.ps1'
      - 'tools/Validate-ChangedToolkits.ps1'
      - 'tools/Validate-InteractiveToolkit.ps1'
      - 'tools/config/upstream-contributor.json'
      - 'tools/check-upstream-contributor-drift.ps1'
      - 'tools/toolkit-ownership.json'
      - 'tools/validate-ai-toolkit.ps1'
      - 'tools/validate-runtime-line-endings.ps1'
      - 'tools/validate-copied-markdown-links.ps1'
      - 'tools/validate-contracts.ps1'
      - '.gitattributes'
      - '.github/workflows/contracts-validation.yml'
  workflow_dispatch:

jobs:
  validate-contracts:
    name: Validate AI Toolkit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run AI toolkit validator
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/Validate-ChangedToolkits.ps1 -ChangedScope Branch -SkipInteractiveRegressionHarness
