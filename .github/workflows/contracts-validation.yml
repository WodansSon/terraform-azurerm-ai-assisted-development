name: Validate AI Toolkit

on:
  push:
    branches: [ main ]
    paths:
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/pull_request_template.md'
      - '.github/skills/**'
      - 'CONTRIBUTING.md'
      - 'docs/AI_TOOLKIT_ALIGNMENT_CHECKLIST.md'
      - 'tools/config/upstream-contributor.json'
      - 'tools/check-upstream-contributor-drift.ps1'
      - 'tools/Get-PRReady.ps1'
      - 'tools/Test-NpmSecurity.ps1'
      - 'tools/Test-PRReady.ps1'
      - 'tools/npm-validation/**'
      - 'tools/validate-ai-toolkit.ps1'
      - 'tools/validate-runtime-line-endings.ps1'
      - 'tools/validate-copied-markdown-links.ps1'
      - 'tools/validate-contracts.ps1'
      - '.gitattributes'
      - '.github/workflows/contracts-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/pull_request_template.md'
      - '.github/skills/**'
      - 'CONTRIBUTING.md'
      - 'docs/AI_TOOLKIT_ALIGNMENT_CHECKLIST.md'
      - 'tools/config/upstream-contributor.json'
      - 'tools/check-upstream-contributor-drift.ps1'
      - 'tools/Get-PRReady.ps1'
      - 'tools/Test-NpmSecurity.ps1'
      - 'tools/Test-PRReady.ps1'
      - 'tools/npm-validation/**'
      - 'tools/validate-ai-toolkit.ps1'
      - 'tools/validate-runtime-line-endings.ps1'
      - 'tools/validate-copied-markdown-links.ps1'
      - 'tools/validate-contracts.ps1'
      - '.gitattributes'
      - '.github/workflows/contracts-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate AI Toolkit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run AI toolkit validator
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/validate-ai-toolkit.ps1 -SkipRegressionHarness -AllowCatalogIssues
