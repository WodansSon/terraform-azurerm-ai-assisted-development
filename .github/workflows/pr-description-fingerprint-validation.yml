name: Validate PR Description Fingerprint Helper

on:
  push:
    branches: [ main ]
    paths:
      - '.gitattributes'
      - '.github/skills/pr-description/scripts/pr-description-fingerprint.go'
      - '.github/skills/pr-description/scripts/pr-description-fingerprint_test.go'
      - '.github/workflows/pr-description-fingerprint-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.gitattributes'
      - '.github/skills/pr-description/scripts/pr-description-fingerprint.go'
      - '.github/skills/pr-description/scripts/pr-description-fingerprint_test.go'
      - '.github/workflows/pr-description-fingerprint-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fingerprint-helper:
    name: Fingerprint Helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Report runtime
        run: |
          go version
          go env GOOS GOARCH
          git --version

      - name: Check formatting
        shell: pwsh
        run: |
          $diff = gofmt -d .github/skills/pr-description/scripts/pr-description-fingerprint.go .github/skills/pr-description/scripts/pr-description-fingerprint_test.go
          if ($diff) {
            $diff
            throw 'Fingerprint helper files are not gofmt-clean.'
          }

      - name: Run static analysis
        run: go vet .github/skills/pr-description/scripts/pr-description-fingerprint.go .github/skills/pr-description/scripts/pr-description-fingerprint_test.go

      - name: Run behavioral tests
        run: go test -v .github/skills/pr-description/scripts/pr-description-fingerprint.go .github/skills/pr-description/scripts/pr-description-fingerprint_test.go

      - name: Run CLI smoke test
        shell: pwsh
        run: |
          $before = git status --porcelain=v1
          $result = go run .github/skills/pr-description/scripts/pr-description-fingerprint.go --repository-root . | ConvertFrom-Json
          $after = git status --porcelain=v1

          if ($result.algorithm -ne 'sha256-v1' -or $result.fingerprint -notmatch '^[0-9a-f]{64}$') {
            throw 'Fingerprint helper returned invalid JSON output.'
          }
          if (($before -join "`n") -ne ($after -join "`n")) {
            throw 'Fingerprint helper changed repository status.'
          }
