<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Workbench shutdown with a non-blocking Event Log warning</title>
  <desc id="description">Approved shutdown-page design reference. A centered, dismissible amber warning above the product branding reads: Event Log Entry Not Saved: Shutdown completed, but its Event Log entry was not recorded. Correlation ID: 00000000-0000-4000-8000-000000000044. Below the branding, Workbench Closed uses a 20 pixel, weight 600 heading, followed by the existing shutdown explanation. Grid rows have 16 pixel gaps. No success panel or acknowledgement is shown.</desc>
  <rect width="1200" height="760" fill="#121314"/>
  <rect x="0.5" y="0.5" width="1199" height="759" rx="8" fill="none" stroke="#333536"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="68" y="294" width="1064" height="46" rx="4" fill="#352a05" stroke="#b89500"/>
    <path d="M92 307L100 321H84Z" fill="none" stroke="#e5ba7d" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M92 312V316 M92 318V318.5" stroke="#e5ba7d" stroke-width="1.4" stroke-linecap="round"/>
    <text x="114" y="322" font-size="14" fill="#e5ba7d"><tspan font-weight="600">Event Log Entry Not Saved:</tspan><tspan> Shutdown completed, but its Event Log entry was not recorded. </tspan><tspan font-weight="600">Correlation ID:</tspan><tspan> 00000000-0000-4000-8000-000000000044</tspan></text>
    <g role="img" aria-label="Close button illustration">
      <path d="M1103 313L1111 321 M1111 313L1103 321" fill="none" stroke="#e5ba7d" stroke-width="1.5"/>
    </g>
    <g transform="translate(397 356)">
